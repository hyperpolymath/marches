# SPDX-License-Identifier: MPL-2.0
name: Actions lock

# Keeps .github/workflows/actions.lock in step with the workflows, remotely.
#
# Why this exists. A workflow listed in actions.lock runs only the commits the
# lock records. When a `uses:` ref changes and the lock does not, that workflow
# ends in startup_failure with no check run at all. Dependabot bumps `uses:`
# refs but does not yet rewrite the lock (dependabot-core gates that behind its
# `github_actions_lockfile` experiment), so every Actions bump broke CI here:
# #34 moved lean-action to v1.6.1 and codeql-action to v4.38.2 while the lock
# still named v1.6.0 / v4.38.0. Branch pins also go stale: the lock held
# cicd-suite@main at 5a10b72, before cicd-suite #32 fixed the gate that fails
# estate-audit on this repo.
#
# What it does. Runs the official extension (github/gh-actions-lock, pinned
# below) with --relock, which records new refs and advances branch pins to
# upstream HEAD, then opens a PR that changes ONLY actions.lock. A run that
# wants to touch any workflow file is refused (same assert as #25).
#
# When. On every push to main that changes a workflow (so a merged Dependabot
# bump is relocked within minutes), weekly (so branch pins track latest), and
# on demand.
#
# ⚠ NO `uses:` ANYWHERE, DELIBERATELY (see labels.yml): this workflow must run
# precisely when the lock is stale, so it depends on no action.
#
# Token. Falls back to GITHUB_TOKEN. Add a repository secret
# ACTIONS_LOCK_TOKEN (fine-grained: Contents, Pull requests and Workflows
# read/write on this repo) if GitHub refuses a GITHUB_TOKEN write under
# .github/workflows/, and so that CI runs on the PR it opens (PRs opened with
# GITHUB_TOKEN do not trigger workflows).

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
  schedule:
    - cron: "41 6 * * 1"   # weekly, after Dependabot's Monday run
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actions-lock
  cancel-in-progress: false

jobs:
  relock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_ACTIONS_LOCK_VERSION: v0.2.0
      GH_TOKEN: ${{ secrets.ACTIONS_LOCK_TOKEN || secrets.GITHUB_TOKEN }}
      BASE: main
      BRANCH: ci/relock-actions
    steps:
      - name: Relock and open a lockfile-only PR
        run: |
          set -euo pipefail
          gh extension install github/gh-actions-lock --pin "$GH_ACTIONS_LOCK_VERSION"
          gh auth setup-git
          gh repo clone "$GITHUB_REPOSITORY" repo -- --quiet --depth 1 --branch "$BASE"
          cd repo

          # Scope: the workflows the lock already tracks, plus this one (it has
          # no `uses:`, so it is recorded as []). Untracked workflows, e.g. the
          # estate's canonical secret-scanner caller, are left alone: onboarding
          # one may rewrite its SHA ref, and those stay a reviewed, manual step.
          # A scoped run never prunes out-of-scope entries.
          mapfile -t scope < <(
            { sed -n "/^workflows:/,/^dependencies:/s/^    '\(\.github\/workflows\/[^']*\)':.*$/\1/p" \
                .github/workflows/actions.lock
              echo .github/workflows/actions-lock.yml
            } | sort -u | while read -r p; do [ -f "$p" ] && echo "$p"; done)
          printf 'relocking: %s\n' "${scope[@]}"

          gh actions-lock --relock --no-narrow --no-migrate-local-actions --no-interactive "${scope[@]}"

          changed=$(git status --porcelain | awk '{print $2}')
          if [ -z "$changed" ]; then
            echo "actions.lock is current; nothing to do."
            exit 0
          fi
          if [ "$changed" != ".github/workflows/actions.lock" ]; then
            echo "::error::The relock wanted to change more than actions.lock. Refusing; handle by hand:"
            git status --porcelain
            exit 1
          fi
          git --no-pager diff --stat

          git switch --quiet -c "$BRANCH"
          git -c user.name='github-actions[bot]' \
              -c user.email='41898583+github-actions[bot]@users.noreply.github.com' \
              commit --quiet -am "chore(actions): relock actions.lock" \
              -m "Regenerated by .github/workflows/actions-lock.yml with github/gh-actions-lock $GH_ACTIONS_LOCK_VERSION (--relock --no-narrow --no-migrate-local-actions). Only actions.lock changes; every workflow file is byte-identical."
          if ! git push --quiet --force origin "$BRANCH"; then
            echo "::error::Push refused. If GitHub rejected a GITHUB_TOKEN write under .github/workflows/, add the ACTIONS_LOCK_TOKEN secret described at the top of this workflow."
            exit 1
          fi

          body="Regenerated by \`actions-lock.yml\` (run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) with \`github/gh-actions-lock $GH_ACTIONS_LOCK_VERSION --relock\`. Only \`.github/workflows/actions.lock\` changes."
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "Updated the open relock PR."
          else
            gh pr create --base "$BASE" --head "$BRANCH" \
              --title "chore(actions): relock actions.lock" --body "$body"
          fi
