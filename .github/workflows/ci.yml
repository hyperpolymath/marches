name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: leanprover/lean-action@v1
      - name: No sorries
        run: "! grep -rn 'sorry' Marches/ Marches.lean"
