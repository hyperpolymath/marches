# SPDX-License-Identifier: MPL-2.0
name: Track latest estate audit

# Weekly: is the estate audit this repository calls behind
# hyperpolymath/proven-cicd-and-workflows main? If so, open a PR that moves the pin in
# main-estate-audit.yml to the suite's HEAD. The PR's own estate-audit run is
# the check: merge it when the five components are green. Nothing reaches
# main unreviewed.
#
# ⚠ NO `uses:` ANYWHERE, DELIBERATELY: actions.lock is keyed by workflow path,
# and this must run even when the lock is stale.
#
# Token: AUTOMATION_TOKEN, a fine-grained token on this repository with
# Contents, Pull requests and Workflows set to read/write. In practice it is
# required: the bump edits a file under .github/workflows/, which
# GITHUB_TOKEN may not write, and a PR opened by GITHUB_TOKEN does not trigger
# the estate-audit run that validates it.

on:
  schedule:
    - cron: "23 7 * * 1"   # weekly, Monday
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: track-estate-audit
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
      BRANCH: ci/track-estate-audit
      CALLER: .github/workflows/main-estate-audit.yml
      BOT_EMAIL: 41898583+github-actions[bot]@users.noreply.github.com
    steps:
      - name: Move the estate-audit pin to the suite HEAD and open a PR
        run: |
          set -euo pipefail
          gh auth setup-git
          base=$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef --jq .defaultBranchRef.name)
          gh repo clone "$GITHUB_REPOSITORY" repo -- --quiet --depth 1 --branch "$base"
          cd repo

          # The suite was renamed from cicd-suite to proven-cicd-and-workflows
          # on 2026-11-09. Actions does not follow a rename in `uses:`, so a
          # caller still on the old name is moved to the new one with its SHA.
          suite=hyperpolymath/proven-cicd-and-workflows
          ref_re='hyperpolymath/(cicd-suite|proven-cicd-and-workflows)/\.github/workflows/main-estate-audit\.yml@'
          pinned=$(grep -oE "${ref_re}[0-9a-f]{40}" "$CALLER" \
                     | sed 's/.*@//' | head -n 1 || true)
          if [ -z "$pinned" ]; then
            echo "::error::$CALLER does not call the suite's reusable estate audit at a full SHA."
            exit 1
          fi
          head=$(git ls-remote "https://github.com/$suite.git" HEAD | cut -f1)
          # A lookup that succeeds but returns no HEAD would leave $head empty,
          # and the rewrite below would strip the pin. Refuse anything else.
          if ! [[ "$head" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::could not resolve $suite HEAD (got '${head}'); no pin was touched."
            exit 1
          fi
          echo "pinned ${pinned:0:7}, $suite HEAD ${head:0:7}"
          if [ "$pinned" = "$head" ] && ! grep -qE 'hyperpolymath/cicd-suite/' "$CALLER"; then
            echo "Already at $suite HEAD."
            exit 0
          fi

          # The bot branch is rebuilt from the default branch each run, which
          # would discard anything else on it. If someone has pushed to it
          # (say, a fix the newer audit needed), leave it for review.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            foreign=$(gh api "repos/$GITHUB_REPOSITORY/compare/$base...$BRANCH" \
                        --jq "[.commits[] | select(.commit.author.email != \"$BOT_EMAIL\")] | length")
            if [ "$foreign" != 0 ]; then
              echo "::warning::$BRANCH carries $foreign commit(s) not made by this workflow; leaving it alone. Merge its PR or delete the branch, then re-run."
              exit 0
            fi
          fi

          # Rewrite only the suite's own reference: name and SHA together.
          sed -i -E "s#${ref_re}${pinned}#${suite}/.github/workflows/main-estate-audit.yml@${head}#" "$CALLER"
          git switch --quiet -c "$BRANCH"
          git -c user.name='github-actions[bot]' -c user.email="$BOT_EMAIL" \
              commit --quiet -am "ci(estate-audit): track proven-cicd-and-workflows ${head:0:7}"
          if ! git push --quiet --force origin "$BRANCH"; then
            echo "::error::Push refused: writing under .github/workflows/ needs the AUTOMATION_TOKEN secret described above."
            exit 1
          fi
          body="Moves the estate audit to $suite \`${head:0:7}\` (was \`${pinned:0:7}\`): https://github.com/$suite/compare/$pinned...$head. This PR's estate-audit run is the check. Opened by \`track-estate-audit.yml\`."
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH" --title "ci(estate-audit): track proven-cicd-and-workflows ${head:0:7}" --body "$body"
          else
            gh pr create --base "$base" --head "$BRANCH" \
              --title "ci(estate-audit): track proven-cicd-and-workflows ${head:0:7}" --body "$body"
          fi
